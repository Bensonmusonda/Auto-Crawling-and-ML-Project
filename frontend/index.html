<!DOCTYPE html>
<html>
    <head>
        <title>Welcome To The DE-MLP</title>
        <link rel="stylesheet" href="stylesheets/index.css" type="text/css">
    </head>
    <body>
        <div class="--left --side">
            <header>
                <h1>DE<span id="black">ML</span> Platform</h1>
            </header>
            <nav>
                <a href="#"><img src="src/crawl.png" alt="">Crawling</a>
                <a href="#"><img src="src/train.png"> Train Model</a>
                <a href="#"><img src="src/visual.png">Visual Analytics</a>
                <a href="#"><img src="src/saved.png">Datasets and Workflows</a>
                <a href="#"><img src="src/settings.png">Settings</a>
            </nav>
            <footer>
                <p>&copy; <span>Bennieslab</span></p>
            </footer>
        </div>
        <main>
            <div class="center">
                <h1>Crawling</h1>
                <div class="enter-source">
                    <input type="text" id="enter-url" placeholder="Enter single page URL">
                </div>

                <div class="enter-source">
                    <input type="text" id="enter-list-url" placeholder="Enter list page URL">
                </div>
                <div class="enter-source">
                    <input type="text" id="enter-link-selector" placeholder="Selector for object links">
                </div>

                <p style="font-weight: 500;">Enter selectors and schema definition for each object</p>
                <form class="add-fields">
                    <table>
                        <tr>
                            <td>
                                <input type="text" id="enter-selector" placeholder="Enter selector">
                            </td>
                            <td class="to-text">to</td>
                            <td>
                                <input type="text" id="enter-field-name" placeholder="Enter field name">
                            </td>
                        </tr>
                    </table>
                    <button id="add-field-btn">Add field</button>
                </form>

                <div id="crawl-div">
                    <button id="crawl">Crawl</button>
                </div>
            </div>

            <div class="--right --side">
                <h1>Results</h1>
                <div id="loader" class="loader" style="display:none;"></div>
            </div>
        </main>

        <script src="scripts/index.js"></script>
    </body>
</html>
