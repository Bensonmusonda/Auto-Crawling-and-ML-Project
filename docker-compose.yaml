services:
  redis:
    image: redis:7-alpine
    container_name: redis_service
    ports:
      - "6379:6379"
    networks:
      - scraper_network

  worker:
    # Use official Playwright image instead of custom build
    image: mcr.microsoft.com/playwright/python:v1.40.0-jammy
    container_name: scraper_worker
    working_dir: /app
    command: >
      bash -c "
        pip install --no-cache-dir -r requirements.txt &&
        celery -A tasks worker --loglevel=info
      "
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    networks:
      - scraper_network
    volumes:
      - ./scraping module:/app

  backend:
    build:
      context: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    networks:
      - scraper_network
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:14-alpine
    container_name: postgres_service
    env_file:
      - .env
    environment: []
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - scraper_network

  ml_worker:
    build:
      context: ./backend
    command: celery -A tasks worker --loglevel=info -Q ml_tasks
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    networks:
      - scraper_network
    volumes:
      - ./backend:/app

volumes:
  pgdata:


networks:
  scraper_network:
    driver: bridge
